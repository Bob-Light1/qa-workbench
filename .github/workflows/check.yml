name: QA Workbench checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npx supabase start --exclude realtime,imgproxy,studio,postgres-meta,logflare,vector,supavisor > /tmp/qa-stack.log 2>&1
      - run: node scripts/local-env.mjs
      - run: nohup npx supabase functions serve --env-file .env.functions.local > /tmp/qa-functions.log 2>&1 &
      - run: npm run functions:wait
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:coverage:api
      - run: QA_BROWSER_ACCOUNTS=.env.coverage.browser npx playwright test tests/browser/coverage.spec.ts
      - run: npm run test:reviews:api
      - run: QA_BROWSER_ACCOUNTS=.env.review.browser npx playwright test tests/browser/reviews.spec.ts
      - run: npm run test:release:db
      - if: always()
        run: npx supabase stop
